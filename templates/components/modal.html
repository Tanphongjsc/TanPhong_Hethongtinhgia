<div x-data="overlayPanel" @open-modal.window="if ($event.detail.id === '{{ modal_id }}') show()" @keydown.escape.window="close()">
  <div x-cloak x-show="open" x-trap.inert.noscroll="open" x-transition.opacity.duration.150ms class="ui-overlay fixed inset-0 z-50 flex items-center justify-center p-4" @click.self="close()">
    <section role="dialog" aria-modal="true" aria-labelledby="{{ modal_id }}-title" class="ui-dialog w-full max-w-lg bg-white">
      <div class="ui-overlay-heading flex items-start justify-between gap-3"><h2 id="{{ modal_id }}-title" class="ui-section-heading">{{ modal_title }}</h2><button type="button" @click="close()" aria-label="Đóng hộp thoại" class="ui-icon-button">{% include "components/icon.html" with name="x" %}</button></div>
      <div class="mt-3">{% if modal_content_template %}{% include modal_content_template %}{% else %}<p>{{ modal_description }}</p>{% endif %}</div>
      {% if confirm_form_id %}<div class="mt-5 flex justify-end gap-2"><button type="button" class="ui-button ui-button--secondary" @click="close()">Hủy</button><button type="submit" form="{{ confirm_form_id }}" @click="$dispatch('confirm-action', { id: '{{ modal_id }}' })" class="ui-button {% if 'Ngừng' in modal_title or 'Xóa' in modal_title %}ui-button--danger{% else %}ui-button--primary{% endif %}">{{ confirm_label }}</button></div>{% endif %}
    </section>
  </div>
</div>
