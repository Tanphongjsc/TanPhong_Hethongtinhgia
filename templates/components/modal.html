<div x-data="overlayPanel" @open-modal.window="if ($event.detail.id === '{{ modal_id }}') show()" @keydown.escape.window="close()">
  <div x-cloak x-show="open" x-trap.inert.noscroll="open" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" @click.self="close()">
    <section role="dialog" aria-modal="true" aria-labelledby="{{ modal_id }}-title" class="w-full max-w-lg rounded-md border border-slate-200 bg-white p-5">
      <div class="flex items-start justify-between gap-3"><h2 id="{{ modal_id }}-title" class="font-semibold">{{ modal_title }}</h2><button type="button" @click="close()" aria-label="Đóng hộp thoại" class="px-2">×</button></div>
      <div class="mt-3">{% if modal_content_template %}{% include modal_content_template %}{% else %}<p>{{ modal_description }}</p>{% endif %}</div>
      {% if confirm_form_id %}<div class="mt-4 flex justify-end gap-2"><button type="button" class="rounded border border-slate-300 px-3 py-2" @click="close()">Hủy</button><button type="submit" form="{{ confirm_form_id }}" @click="$dispatch('confirm-action', { id: '{{ modal_id }}' })" class="rounded bg-brand-600 px-3 py-2 text-white">{{ confirm_label }}</button></div>{% endif %}
    </section>
  </div>
</div>
