{% if href %}
<a href="{{ href }}" class="ui-button {% if primary %}ui-button--primary{% else %}ui-button--secondary{% endif %}">{{ label }}{% if primary %}{% include "components/icon.html" with name="arrow-up-right" %}{% endif %}</a>
{% else %}
<button type="{{ type|default:'button' }}" {% if form_id %}form="{{ form_id }}"{% endif %} {% if disabled %}disabled{% endif %} class="ui-button {% if primary %}{% if label == 'Xác nhận xóa' %}ui-button--danger{% else %}ui-button--primary{% endif %}{% else %}ui-button--secondary{% endif %}">{{ label }}{% if primary %}{% if label == 'Xác nhận xóa' %}{% include "components/icon.html" with name="trash-2" %}{% else %}{% include "components/icon.html" with name="arrow-right" %}{% endif %}{% endif %}</button>
{% endif %}
