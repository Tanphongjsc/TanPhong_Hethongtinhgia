<div class="ui-field {% if field.name == 'description' or field.name == 'name' %}md:col-span-2{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="ui-checkbox-field">{{ field }}<label for="{{ field.id_for_label }}" class="font-medium">{{ field.label }}</label></div>
  {% else %}
    <label for="{{ field.id_for_label }}" class="ui-field-label">{{ field.label }}{% if field.field.required %}<span aria-hidden="true" class="text-red-700"> *</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  <p id="{{ field.id_for_label }}_help" class="ui-field-help">{{ field.help_text }}</p>
  <ul id="{{ field.id_for_label }}_errors" class="ui-field-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
</div>
