<div x-data="toast" x-show="visible" x-transition.opacity.duration.150ms data-severity="{{ message.tags|default:'success' }}" class="ui-toast" role="status">
  {% include "components/icon.html" with name="circle-check" %}
  <p>{{ message }}</p>
  <button type="button" @click="visible = false" class="ui-icon-button -mt-1 -mr-1 ml-auto shrink-0" aria-label="Đóng thông báo">{% include "components/icon.html" with name="x" %}</button>
</div>
