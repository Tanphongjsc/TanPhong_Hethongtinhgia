<div x-data="toast" x-show="visible" class="flex items-start gap-3 rounded border border-emerald-200 bg-white p-3 text-emerald-800" role="status">
  <p>{{ message }}</p>
  <button type="button" @click="visible = false" class="ml-auto px-1 text-slate-500" aria-label="Đóng thông báo">×</button>
</div>
