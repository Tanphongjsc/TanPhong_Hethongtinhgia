{% for title, fields in form.sections %}
<fieldset class="mb-5 border-b border-slate-200 pb-5">
  <legend class="mb-3 font-semibold text-slate-900">{{ title }}</legend>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    {% for field in fields %}{% include "components/form_field.html" %}{% endfor %}
  </div>
</fieldset>
{% endfor %}
