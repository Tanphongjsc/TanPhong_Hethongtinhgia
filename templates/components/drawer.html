<div x-data="overlayPanel({{ drawer_open|yesno:'true,false' }})" @open-drawer.window="if ($event.detail.id === '{{ drawer_id }}') show()" @keydown.escape.window="close()">
  <div x-cloak x-show="open" x-trap.inert.noscroll="open" class="fixed inset-0 z-50 flex justify-end bg-slate-900/40" @click.self="close()">
    <section role="dialog" aria-modal="true" aria-labelledby="{{ drawer_id }}-title" class="h-full w-full max-w-md overflow-y-auto border-l border-slate-200 bg-white p-5">
      <div class="flex items-start justify-between gap-3"><h2 id="{{ drawer_id }}-title" class="font-semibold">{{ drawer_title }}</h2><button type="button" @click="close()" aria-label="Đóng chi tiết" class="px-2">×</button></div>
      <div class="mt-4">{% include drawer_content_template %}</div>
    </section>
  </div>
</div>
