{% load costing_tags %}
<p class="mb-4 text-xs text-slate-500">Diễn giải được lưu tại lần tính này. Không sử dụng lại giá hoặc công thức hiện tại.</p>
{% for entry in steps %}<section class="mb-4 border-b border-slate-200 pb-3"><h3 class="mb-2 font-semibold">{{ entry.title }}</h3><dl class="space-y-2">{% for label, value in entry.fields %}<div><dt class="text-xs text-slate-500">{{ label }}</dt><dd class="break-words">{{ value|trace_value }}</dd></div>{% endfor %}</dl></section>{% empty %}<p>Không có dữ liệu giải thích.</p>{% endfor %}
