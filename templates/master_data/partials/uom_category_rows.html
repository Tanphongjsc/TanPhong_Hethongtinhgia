{% for record in records %}
<tr class="h-12 border-t border-slate-200 hover:bg-slate-50">
  <td class="px-3 py-2 font-mono text-xs"><a href="{% url detail_url_name record.pk %}" class="font-medium text-brand-700 hover:underline">{{ record.code }}</a></td>
  <td class="max-w-80 truncate px-3 py-2" title="{{ record.name }}">{{ record.name }}</td>
  <td class="px-3 py-2 font-mono text-xs">{{ record.dimension_code }}</td>
  <td class="px-3 py-2">{% include "master_data/partials/reference_data_status.html" %}</td>
  <td class="px-3 py-2 text-right">{% include "master_data/partials/reference_data_actions.html" %}</td>
</tr>
{% endfor %}
