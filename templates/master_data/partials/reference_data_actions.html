<a href="{% url detail_url_name record.pk %}" class="ui-icon-button" aria-label="Xem {{ resource_label }} {{ record.pk }}" data-tooltip="Xem chi tiết">{% include "components/icon.html" with name="eye" %}<span class="sr-only">Xem chi tiết</span></a>
{% if can_edit %}
  {% if resource != 'uom_conversion' or record.organization_id == current_organization.pk %}
    <a href="{% url edit_url_name record.pk %}" class="ui-icon-button" aria-label="Sửa {{ resource_label }} {{ record.pk }}" data-tooltip="Chỉnh sửa">{% include "components/icon.html" with name="square-pen" %}<span class="sr-only">Chỉnh sửa</span></a>
  {% endif %}
{% endif %}
