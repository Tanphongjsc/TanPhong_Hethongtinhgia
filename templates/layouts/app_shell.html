{% extends "base/base.html" %}
{% block body %}
<div x-data="appShell" @keydown.escape.window="mobileOpen = false" class="ui-shell min-h-screen" :data-collapsed="desktop && !expanded ? 'true' : 'false'">
  {% include "layouts/sidebar.html" %}
  <div class="ui-workspace min-h-screen lg:pl-60" :class="{ 'lg:pl-60': expanded, 'lg:pl-18': !expanded }">
    {% include "layouts/topbar.html" %}
    <main id="main-content" tabindex="-1" data-resource-label="{{ resource_label|default:'dữ liệu' }}" class="ui-main mx-auto">
      {% include "layouts/page_header.html" %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
