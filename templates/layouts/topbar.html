<header class="ui-topbar sticky top-0 z-30 flex items-center">
  <button type="button" @click="toggleSidebar" class="ui-icon-button" aria-label="Đóng hoặc mở thanh điều hướng" aria-controls="workspace-sidebar" :aria-expanded="desktop ? expanded : mobileOpen" data-tooltip="Đóng hoặc mở thanh điều hướng">
    {% include "components/icon.html" with name="panel-left" %}
  </button>
  <div class="ui-topbar-context">
    {% if breadcrumbs %}{% include "layouts/breadcrumbs.html" %}{% else %}<span class="font-medium text-slate-700">Hệ thống tính giá thành</span>{% endif %}
  </div>
  <div class="ui-density" role="group" aria-label="Mật độ hiển thị">
    <button type="button" @click="setDensity('compact')" :aria-pressed="density === 'compact'" aria-label="Mật độ gọn" data-tooltip="Mật độ gọn">{% include "components/icon.html" with name="rows-3" %}<span class="ui-density-label">Gọn</span></button>
    <button type="button" @click="setDensity('comfortable')" :aria-pressed="density === 'comfortable'" aria-label="Mật độ thoáng" data-tooltip="Mật độ thoáng">{% include "components/icon.html" with name="rows-4" %}<span class="ui-density-label">Thoáng</span></button>
  </div>
</header>
